<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EufrasioJuegos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: white;
            text-align: center;
            padding: 50px 15px 40px;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* Secciones */
        .seccion {
            max-width: 1100px;
            margin: 0 auto 45px;
        }

        .seccion[hidden] {
            display: none;
        }

        .seccion h2 {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 26px;
            margin: 0 0 20px;
        }

        .seccion h2::before,
        .seccion h2::after {
            content: "";
            flex: 1;
            height: 2px;
            background: #3a3a5c;
        }

        .contenedor-botones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .boton {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 250px;
            height: 120px;
            padding: 15px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            box-sizing: border-box;
            background-color: #2c2c48;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-shadow: 2px 2px 5px black;
        }

        .boton:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }

        .boton:focus-visible {
            outline: 3px solid #f1c40f;
            outline-offset: 3px;
        }

        /* Etiqueta para los juegos de Game Boy Advance */
        .boton.gba::after {
            content: "GBA";
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 2px 8px;
            border-radius: 6px;
            background: #4a3f9a;
            font-size: 12px;
            text-shadow: none;
        }

        /* ===== Favoritos ===== */
        .tarjeta {
            position: relative;
            display: inline-flex;
        }

        .estrella {
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 2;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition: 0.2s;
        }

        .estrella:hover {
            transform: scale(1.15);
        }

        .estrella.activa {
            color: #f1c40f;
        }

        .boton-favoritos {
            margin: -10px 0 30px;
            padding: 10px 22px;
            border: 2px solid #f1c40f;
            border-radius: 25px;
            background: transparent;
            color: #f1c40f;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-favoritos:hover,
        .boton-favoritos[aria-pressed="true"] {
            background: #f1c40f;
            color: #1e1e2f;
        }

        .sin-favoritos {
            color: #9a9ab8;
        }

        .wordle { background-image: url("wordle.png"); }
        .geometry { background-image: url("geometrydash.jpg"); }
        .mario { background-image: url("mario.png"); }
        .mario64 { background-image: url("mario64.png"); }
        .fnaf1 { background-image: url("fnaf1.png"); }
        .fnaf2 { background-image: url("fnaf2.png"); }
        .fnaf3 { background-image: url("fnaf3.png"); }
        .fnaf4 { background-image: url("fnaf4.png"); }
        .pizzeria-simulator { background-image: url("pizzeria-simulator.png"); }
        .sister-location { background-image: url("sister-location.png"); }
        .fnaf-world { background-image: url("fnaf-world.png"); }
        .ultimate-custom-night { background-image: url("ultimate-custom-night.png"); }
        .snake { background-image: url("snake.jpg"); }
        .kirby { background-image: url("kirby.png"); }
        .pokemon { background-image: url("pokemon.jpg"); }
        .sonic { background-image: url("sonic.jpg"); }
        .chess { background-image: url("chess.png"); }
        .pvsz { background-image: url("pvsz.png"); }
        .fnafepstein { background-image: url("fnafepstein.jpg"); }

        .volver {
            background-color: #e74c3c;
            background-image: none;
            height: auto;
            margin-top: 10px;
        }

        .volver:hover {
            background-color: #c0392b;
            transform: scale(1.05);
            filter: none;
        }

        /* ===== Ventana emergente del juego ===== */
        #ventana {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
        }

        #ventana[hidden] {
            display: none;
        }

        .ventana-caja {
            position: relative;
            width: min(900px, 95vw, calc(88vh * 1.5));
            aspect-ratio: 3 / 2;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .ventana-caja iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 10px;
        }

        #ventana-cerrar {
            position: absolute;
            top: -16px;
            right: -16px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #e74c3c;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        #ventana-cerrar:hover {
            background: #c0392b;
        }

        @media (max-width: 600px) {
            #ventana-cerrar { top: -44px; right: 0; }
        }

        body.jugando {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>Bienvenido a la página de juegos</h1>

    <button type="button" class="boton-favoritos" id="ver-favoritos" aria-pressed="false">⭐ Mis favoritos</button>

    <section class="seccion" id="favoritos" hidden>
        <h2>Favoritos</h2>
        <div class="contenedor-botones" id="sec-favoritos"></div>
        <p class="sin-favoritos" id="sin-favoritos">Todavía no tienes favoritos. Pulsa la ☆ de un juego para añadirlo.</p>
    </section>

    <!-- Los juegos de GBA se colocan solos en su sección según el campo "seccion" de gba/roms/games.json -->

    <section class="seccion">
        <h2>Kirby</h2>
        <div class="contenedor-botones" id="sec-kirby">
            <a href="https://chonni777.github.io/Kirby-Super-Star/" class="boton kirby" aria-label="Kirby Super Star"></a>
        </div>
    </section>

    <section class="seccion">
        <h2>Mario</h2>
        <div class="contenedor-botones" id="sec-mario">
            <a href="https://chonni777.github.io/supermariobros/" class="boton mario" aria-label="Super Mario Bros"></a>
            <a href="https://chonni777.github.io/mario64/" class="boton mario64" aria-label="Super Mario 64"></a>
        </div>
    </section>

    <section class="seccion">
        <h2>Pokémon</h2>
        <div class="contenedor-botones" id="sec-pokemon">
            <a href="https://chonni777.github.io/pokemon-esmeralda/" class="boton pokemon">Pokemon Esmeralda</a>
        </div>
    </section>

    <section class="seccion">
        <h2>Zelda</h2>
        <div class="contenedor-botones" id="sec-zelda"></div>
    </section>

    <section class="seccion">
        <h2>RPG</h2>
        <div class="contenedor-botones" id="sec-rpg"></div>
    </section>

    <section class="seccion">
        <h2>Deportes</h2>
        <div class="contenedor-botones" id="sec-deportes"></div>
    </section>

    <section class="seccion">
        <h2>Anime</h2>
        <div class="contenedor-botones" id="sec-anime"></div>
    </section>

    <section class="seccion">
        <h2>FNAF</h2>
        <div class="contenedor-botones" id="sec-fnaf">
            <a href="https://chonni777.github.io/fnaf1/" class="boton fnaf1" aria-label="FNAF 1"></a>
            <a href="https://chonni777.github.io/fnaf2/" class="boton fnaf2" aria-label="FNAF 2"></a>
            <a href="https://chonni777.github.io/fnaf3/" class="boton fnaf3" aria-label="FNAF 3"></a>
            <a href="https://chonni777.github.io/fnaf4/" class="boton fnaf4" aria-label="FNAF 4"></a>
            <a href="https://chonni777.github.io/Pizzeria-Simulator/" class="boton pizzeria-simulator" aria-label="Pizzeria Simulator"></a>
            <a href="https://chonni777.github.io/sister-location/" class="boton sister-location" aria-label="Sister Location"></a>
            <a href="https://chonni777.github.io/fnaf-world/" class="boton fnaf-world" aria-label="FNAF World"></a>
            <a href="https://chonni777.github.io/ultimate-custom-night/" class="boton ultimate-custom-night" aria-label="Ultimate Custom Night"></a>
            <a href="https://chonni777.github.io/FNAFEpstein/" class="boton fnafepstein">Five Nights at Epstein</a>
        </div>
    </section>

    <section class="seccion">
        <h2>Otros</h2>
        <div class="contenedor-botones" id="sec-otros">
            <a href="https://chonni777.github.io/eufrasiowordle/" class="boton wordle" aria-label="Wordle"></a>
            <a href="https://chonni777.github.io/Geomtry-Dash/" class="boton geometry">Geometry Dash</a>
            <a href="https://chonni777.github.io/snkae/" class="boton snake">Snake</a>
            <a href="https://chonni777.github.io/sonic/" class="boton sonic" aria-label="Sonic"></a>
            <a href="https://chonni777.github.io/eufrasiochess/" class="boton chess">Ajedrez</a>
            <a href="https://chonni777.github.io/plantvszombies/" class="boton pvsz" aria-label="Plants vs Zombies"></a>
        </div>
    </section>

    <a href="https://chonni777.github.io/Calendari-Vicent-Plantada/" class="boton volver">⬅ Volver</a>

    <!-- Ventana emergente donde se abre el juego GBA -->
    <div id="ventana" hidden>
        <div class="ventana-caja">
            <button id="ventana-cerrar" aria-label="Cerrar juego">✕</button>
            <iframe id="ventana-marco" title="Juego" allow="fullscreen; gamepad; autoplay"></iframe>
        </div>
    </div>

    <script>
        const ventana = document.getElementById('ventana');
        const marco = document.getElementById('ventana-marco');

        function abrirJuego(game) {
            marco.src = 'gba/jugar.html?juego=' + encodeURIComponent(game.id);
            ventana.hidden = false;
            document.body.classList.add('jugando');
            marco.addEventListener('load', () => marco.focus(), { once: true });
        }

        function cerrarJuego() {
            marco.src = 'about:blank'; // detiene el juego y el sonido
            ventana.hidden = true;
            document.body.classList.remove('jugando');
        }

        document.getElementById('ventana-cerrar').addEventListener('click', cerrarJuego);
        // Clic en el fondo oscuro también cierra
        ventana.addEventListener('click', (ev) => { if (ev.target === ventana) cerrarJuego(); });

        // Coloca cada juego de GBA en su sección (campo "seccion" de gba/roms/games.json)
        fetch('gba/roms/games.json', { cache: 'no-cache' })
            .then(res => res.ok ? res.json() : [])
            .then(games => {
                games.forEach(game => {
                    const destino = document.getElementById('sec-' + game.seccion)
                                 || document.getElementById('sec-otros');
                    const a = document.createElement('a');
                    a.href = 'gba/jugar.html?juego=' + encodeURIComponent(game.id);
                    a.className = 'boton gba';
                    a.style.backgroundImage = 'url("' + game.image + '")';
                    a.setAttribute('aria-label', game.id);
                    a.dataset.gba = game.id;
                    destino.appendChild(a);
                });
            })
            .catch(err => console.warn('No se pudo cargar la lista de juegos GBA:', err))
            .finally(() => {
                // Oculta las secciones que se hayan quedado sin juegos
                document.querySelectorAll('.seccion:not(#favoritos)').forEach(sec => {
                    sec.hidden = !sec.querySelector('.boton');
                });
                prepararFavoritos();
            });

        // Los juegos GBA (también sus copias en Favoritos) se abren en la ventana emergente
        document.addEventListener('click', (ev) => {
            const a = ev.target.closest('a[data-gba]');
            if (!a) return;
            ev.preventDefault();
            abrirJuego({ id: a.dataset.gba });
        });

        // ===== Favoritos (se guardan en el navegador con localStorage) =====
        const CLAVE_FAVORITOS = 'eufrasiojuegos-favoritos';
        const contFavoritos = document.getElementById('sec-favoritos');
        const botonVerFavoritos = document.getElementById('ver-favoritos');

        function leerFavoritos() {
            try {
                return JSON.parse(localStorage.getItem(CLAVE_FAVORITOS)) || [];
            } catch (e) {
                return [];
            }
        }

        function guardarFavoritos(lista) {
            try {
                localStorage.setItem(CLAVE_FAVORITOS, JSON.stringify(lista));
            } catch (e) {
                console.warn('No se pudieron guardar los favoritos:', e);
            }
        }

        // Cada juego se identifica por su enlace
        function idJuego(a) {
            return a.getAttribute('href');
        }

        // Envuelve un botón de juego y le añade la estrella
        function crearTarjeta(a) {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta';
            a.replaceWith(tarjeta);
            tarjeta.appendChild(a);

            const estrella = document.createElement('button');
            estrella.type = 'button';
            estrella.className = 'estrella';
            estrella.dataset.juego = idJuego(a);
            estrella.addEventListener('click', () => alternarFavorito(idJuego(a)));
            tarjeta.appendChild(estrella);
        }

        function alternarFavorito(id) {
            const favs = leerFavoritos();
            const i = favs.indexOf(id);
            if (i === -1) favs.push(id); else favs.splice(i, 1);
            guardarFavoritos(favs);
            pintarFavoritos();
        }

        function pintarFavoritos() {
            const favs = leerFavoritos();

            // Actualiza todas las estrellas
            document.querySelectorAll('.estrella').forEach(est => {
                const activa = favs.includes(est.dataset.juego);
                est.classList.toggle('activa', activa);
                est.textContent = activa ? '★' : '☆';
                est.setAttribute('aria-label', activa ? 'Quitar de favoritos' : 'Añadir a favoritos');
                est.title = est.getAttribute('aria-label');
            });

            // Rellena la sección de Favoritos con copias de los juegos
            contFavoritos.innerHTML = '';
            favs.forEach(id => {
                const original = [...document.querySelectorAll('.seccion:not(#favoritos) .boton')]
                    .find(a => idJuego(a) === id);
                if (!original) return;
                const tarjeta = original.parentElement.cloneNode(true);
                tarjeta.querySelector('.estrella')
                    .addEventListener('click', () => alternarFavorito(id));
                contFavoritos.appendChild(tarjeta);
            });

            document.getElementById('sin-favoritos').hidden = contFavoritos.children.length > 0;
        }

        // El botón "Mis favoritos" muestra solo los favoritos, o vuelve a mostrarlo todo
        botonVerFavoritos.addEventListener('click', () => {
            const soloFavoritos = botonVerFavoritos.getAttribute('aria-pressed') !== 'true';
            botonVerFavoritos.setAttribute('aria-pressed', soloFavoritos);
            botonVerFavoritos.textContent = soloFavoritos ? '🎮 Ver todos los juegos' : '⭐ Mis favoritos';
            document.getElementById('favoritos').hidden = !soloFavoritos;
            document.querySelectorAll('.seccion:not(#favoritos)').forEach(sec => {
                sec.hidden = soloFavoritos || !sec.querySelector('.boton');
            });
        });

        function prepararFavoritos() {
            document.querySelectorAll('.seccion:not(#favoritos) .boton').forEach(crearTarjeta);
            pintarFavoritos();
        }
    </script>

</body>
</html>
