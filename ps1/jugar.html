<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS1</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #juego { width: 100%; height: 100%; }
        #error { color: white; font-family: Arial, sans-serif; display: flex;
                 align-items: center; justify-content: center; height: 100%;
                 text-align: center; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="juego"></div>

    <script>
        // Pon true si subes una BIOS a ps1/bios/scph5501.bin (mejora la compatibilidad)
        const USAR_BIOS = true;

        const id = new URLSearchParams(location.search).get('juego');

        fetch('roms/games.json', { cache: 'no-cache' })
            .then(res => res.json())
            .then(games => {
                const game = games.find(g => g.id === id);
                if (!game) throw new Error('Juego no encontrado: ' + id);

                window.EJS_player = '#juego';
                window.EJS_core = 'psx';
                window.EJS_gameName = game.id;
                window.EJS_gameUrl = 'roms/' + game.rom;
                if (USAR_BIOS) window.EJS_biosUrl = 'bios/scph5501.bin';
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                window.EJS_startOnLoaded = true;
                window.EJS_language = 'es-ES';
                // Solo el juego: sin botones de más
                window.EJS_Buttons = {
                    screenRecord: false, cheat: false, cacheManager: false,
                    saveSavFiles: false, loadSavFiles: false, exitEmulation: false
                };

                const s = document.createElement('script');
                s.src = window.EJS_pathtodata + 'loader.js';
                document.body.appendChild(s);
            })
            .catch(err => {
                document.getElementById('juego').outerHTML =
                    '<div id="error">No se pudo cargar el juego. Revisa que el archivo esté en ps1/roms y que su nombre coincida con games.json.</div>';
                console.error(err);
            });
    </script>
</body>
</html>
